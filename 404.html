<style>

  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:#fff;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  .nf-nav{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 5rem;border-bottom:1px solid var(--border)}
  .nf-nav .logo{font-size:1rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;text-decoration:none}
  .nf-nav .logo span{color:var(--gold)}
  .nf-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4rem 1.5rem}
  .nf-code{font-size:.66rem;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:1.2rem}
  .nf-main h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;line-height:1.1;margin-bottom:1rem}
  .nf-main h1 em{font-style:normal;color:var(--gold)}
  .nf-main p{color:var(--muted);font-size:1rem;line-height:1.6;max-width:480px;margin-bottom:2.2rem}
  .nf-actions{display:flex;flex-wrap:wrap;gap:.9rem;justify-content:center}
  .btn-gold{background:var(--gold);color:#0c0c0c;font-weight:700;font-size:.82rem;letter-spacing:.04em;padding:.9rem 1.7rem;border-radius:8px;text-decoration:none;transition:transform .15s}
  .btn-gold:hover{transform:translateY(-2px)}
  .btn-outline{border:1px solid var(--border);color:#fff;font-weight:600;font-size:.82rem;letter-spacing:.04em;padding:.9rem 1.7rem;border-radius:8px;text-decoration:none;transition:border-color .2s}
  .btn-outline:hover{border-color:var(--gold)}
  .nf-links{margin-top:2.6rem;display:flex;flex-wrap:wrap;gap:1.2rem;justify-content:center}
  .nf-links a{color:var(--muted);font-size:.78rem;letter-spacing:.04em;text-decoration:none;transition:color .2s}
  .nf-links a:hover{color:var(--gold)}
  .nf-foot{border-top:1px solid var(--border);padding:1.8rem 1.5rem;text-align:center;color:var(--muted);font-size:.78rem}
  .nf-foot a{color:var(--gold);text-decoration:none}
  @media(max-width:768px){ .nf-nav{padding:1rem 1.4rem} }
